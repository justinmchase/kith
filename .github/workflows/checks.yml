name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  specs:
    name: Specs audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: justinmchase/specs@v1

  rust:
    name: Cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: justinmchase/uffda/.github/actions/uffda-setup@main
        with:
          version: 0.10.7
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test
