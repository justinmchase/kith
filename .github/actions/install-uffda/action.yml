name: Install released Uffda CLI
description: >
  Install a released uffda CLI for the runner OS and architecture.
  Checksums are hashed in Node so Windows Git Bash does not read the
  binary in text mode, and the script stays on Bash 3.2 for macOS.
inputs:
  version:
    description: Release tag or SemVer without a leading v (for example 0.10.8).
    required: true
  repository:
    description: GitHub repository that publishes Uffda release binaries.
    required: false
    default: justinmchase/uffda
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install Uffda CLI
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64) target="x86_64-unknown-linux-gnu" ;;
          Linux-ARM64) target="aarch64-unknown-linux-gnu" ;;
          Windows-X64) target="x86_64-pc-windows-msvc" ;;
          Windows-ARM64) target="aarch64-pc-windows-msvc" ;;
          macOS-X64) target="x86_64-apple-darwin" ;;
          macOS-ARM64) target="aarch64-apple-darwin" ;;
          *)
            echo "Unsupported runner platform: ${RUNNER_OS}/${RUNNER_ARCH}" >&2
            exit 1
            ;;
        esac

        version="${INPUT_VERSION#v}"
        if [[ "${target}" == *windows* ]]; then
          asset="uffda-${version}-${target}.exe"
        else
          asset="uffda-${version}-${target}"
        fi

        tmpdir="$(mktemp -d)"
        gh release download "${version}" --repo "${INPUT_REPOSITORY}" --dir "${tmpdir}" \
          --pattern "${asset}" --pattern SHA256SUMS
        expected="$(awk -v name="${asset}" '{ gsub(/\r/, ""); if ($2 == name) { print $1; exit } }' "${tmpdir}/SHA256SUMS")"
        if [[ -z "${expected}" ]]; then
          echo "No checksum entry for ${asset}" >&2
          exit 1
        fi
        actual="$(node -e 'const fs=require("fs");const c=require("crypto");process.stdout.write(c.createHash("sha256").update(fs.readFileSync(process.argv[1])).digest("hex"))' "${tmpdir}/${asset}")"
        if [[ "${actual}" != "${expected}" ]]; then
          echo "Checksum mismatch for ${asset}" >&2
          echo "expected ${expected}" >&2
          echo "actual   ${actual}" >&2
          exit 1
        fi

        bin_dir="${RUNNER_TEMP}/uffda/bin"
        mkdir -p "${bin_dir}"
        if [[ "${target}" == *windows* ]]; then
          install_path="${bin_dir}/uffda.exe"
        else
          install_path="${bin_dir}/uffda"
        fi
        cp "${tmpdir}/${asset}" "${install_path}"
        chmod +x "${install_path}"
        echo "${bin_dir}" >> "${GITHUB_PATH}"
        echo "Installed uffda ${version} (${target}) at ${install_path}"
