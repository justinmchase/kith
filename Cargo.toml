[package]
name = "kith"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Kith runtime and CLI: components, message dispatch, and workflows on Uffda"
repository = "https://github.com/justinmchase/kith"
publish = false

[[bin]]
name = "kith"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uffda-heap = { version = "0.10.7", default-features = false }
uffda-runtime = { version = "0.10.7", default-features = false }
url = "2"

[build-dependencies]
uffda-build = "0.10.7"
