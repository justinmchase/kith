[package]
name = "kith"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Kith CLI: parse, check, compile, and run .kith programs"
repository = "https://github.com/justinmchase/kith"
# GitHub Releases ship this binary. crates.io publishes kith-runtime.
publish = false

[workspace]
members = ["crates/kith-runtime"]
resolver = "2"

[[bin]]
name = "kith"
path = "src/main.rs"

[dependencies]
kith-runtime = { path = "crates/kith-runtime", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uffda-runtime = { version = "0.10.8", default-features = false }
url = "2"

[build-dependencies]
uffda-build = "0.10.8"
